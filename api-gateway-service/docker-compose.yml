services:
  # The FastAPI Web Service
  web:
    build: .
    ports:
      - "8000:8000"
    #command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/micro_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy # The gateway only opens once Rabbit is truly ready
  # The Persistent Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: micro_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The In-Memory Cache
  redis:
    image: redis:7-alpine

  # The Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672" # Management UI
    environment:
      # Adjusting the watermark to be more permissive (use with caution)
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK_RELATIVE=0.7
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M # Ensure the container has enough headroom

volumes:
  postgres_data: